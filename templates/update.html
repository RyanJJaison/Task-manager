{% extends 'base.html' %}

{% block title %}Edit task · Task Master{% endblock %}

{% block body %}

<div class="mx-auto max-w-lg">

    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">

        <h1 class="mb-6 text-xl font-semibold tracking-tight">Edit task</h1>

        <form action="{{ url_for('update', id=task.id) }}"
              method="POST"
              class="space-y-4">

            <div>
                <label for="content" class="mb-1 block text-sm font-medium text-slate-700">
                    Task
                </label>
                <input type="text"
                       name="content"
                       id="content"
                       required
                       value="{{ task.content }}"
                       class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm
                              focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500">
            </div>

            <div>
                <label for="estimated_minutes" class="mb-1 block text-sm font-medium text-slate-700">
                    Estimated minutes
                </label>
                <input type="number"
                       name="estimated_minutes"
                       id="estimated_minutes"
                       min="{{ min_minutes }}"
                       max="{{ max_minutes }}"
                       value="{{ task.estimated_minutes or '' }}"
                       class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm
                              focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500">
            </div>

            <div class="flex gap-2">
                <button type="submit"
                        class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white
                               hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-500">
                    Save changes
                </button>
                <a href="{{ url_for('home') }}"
                   class="rounded-md border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
