{% extends 'base.html' %}

{% block title %}Edit task · Nudge{% endblock %}

{% block body %}

<div class="mx-auto max-w-lg">

    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">

        <h1 class="mb-6 text-lg font-semibold tracking-tight">Edit task</h1>

        <form action="{{ url_for('update', id=task.id) }}"
              method="POST"
              class="space-y-4">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="content" class="mb-1 block text-sm font-medium text-slate-700">
                    Task
                </label>
                <input type="text"
                       name="content"
                       id="content"
                       required
                       value="{{ task.content }}"
                       class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm shadow-sm transition
                              focus:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-400/30">
            </div>

            <div>
                <label for="estimated_minutes" class="mb-1 block text-sm font-medium text-slate-700">
                    Estimated minutes
                </label>
                <input type="number"
                       name="estimated_minutes"
                       id="estimated_minutes"
                       min="{{ min_minutes }}"
                       max="{{ max_minutes }}"
                       value="{{ task.estimated_minutes or '' }}"
                       class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-sm shadow-sm transition
                              focus:border-orange-400 focus:outline-none focus:ring-2 focus:ring-orange-400/30">
            </div>

            <div class="flex gap-2">
                <button type="submit"
                        class="rounded-xl bg-gradient-to-r from-amber-400 via-orange-500 to-rose-500 px-4 py-2.5
                               text-sm font-bold text-white shadow-lg shadow-orange-500/30 transition
                               hover:brightness-105
                               focus:outline-none focus:ring-2 focus:ring-orange-400/50">
                    Save changes
                </button>
                <a href="{{ url_for('home') }}"
                   class="rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-medium text-slate-700
                          transition hover:bg-slate-50">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
