{% extends 'base.html' %}

{% block title %}Register · Task Master{% endblock %}

{% block body %}

<div class="mx-auto max-w-sm">

    <div class="rounded-lg border border-slate-200 bg-white p-6 shadow-sm">

        <h1 class="mb-1 text-xl font-semibold tracking-tight">Create an account</h1>
        <p class="mb-6 text-sm text-slate-500">Start tracking your tasks.</p>

        <form method="POST" class="space-y-4">

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="username" class="mb-1 block text-sm font-medium text-slate-700">
                    Username
                </label>
                <input type="text"
                       name="username"
                       id="username"
                       required
                       autocomplete="username"
                       class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm
                              focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500">
            </div>

            <div>
                <label for="password" class="mb-1 block text-sm font-medium text-slate-700">
                    Password
                </label>
                <input type="password"
                       name="password"
                       id="password"
                       required
                       autocomplete="new-password"
                       class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm shadow-sm
                              focus:border-slate-500 focus:outline-none focus:ring-1 focus:ring-slate-500">
            </div>

            <button type="submit"
                    class="w-full rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white
                           hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-500">
                Register
            </button>

        </form>

    </div>

    <p class="mt-4 text-center text-sm text-slate-500">
        Already have an account?
        <a href="{{ url_for('login') }}" class="font-medium text-slate-900 hover:underline">Log in</a>
    </p>

</div>

{% endblock %}
